<style>
  :root {
    --okolo-black: #080808;
    --okolo-text: #171717;
    --okolo-muted: #7d7d7d;
    --okolo-line: #e7e7e7;
    --okolo-soft: #f7f7f7;
    --okolo-error: #c62828;
    --okolo-success: #0f7a3a;
    --okolo-radius: 0;
    --okolo-font: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  .okolo-checkout {
    color: var(--okolo-text);
    font-family: var(--okolo-font);
    max-width: 1320px;
    margin: 0 auto;
    padding: 42px 48px 64px;
  }

  .okolo-checkout *,
  .okolo-checkout *::before,
  .okolo-checkout *::after {
    box-sizing: border-box;
    letter-spacing: 0;
  }

  .okolo-breadcrumbs {
    display: flex;
    align-items: center;
    gap: 9px;
    margin-bottom: 34px;
    color: #a0a0a0;
    font-size: 13px;
    line-height: 1.4;
  }

  .okolo-breadcrumbs span:last-child {
    color: #1f1f1f;
    font-weight: 600;
  }

  .okolo-checkout h1 {
    margin: 0 0 28px;
    color: var(--okolo-black);
    font-size: 30px;
    font-weight: 800;
    line-height: 1.15;
    text-transform: uppercase;
  }

  .okolo-layout {
    display: grid;
    grid-template-columns: minmax(0, 1.08fr) minmax(380px, 0.92fr);
    gap: 58px;
    align-items: start;
  }

  .okolo-form {
    min-width: 0;
  }

  .okolo-step {
    margin: 0 0 32px;
    padding: 0;
    border: 0;
  }

  .okolo-step-heading {
    display: flex;
    align-items: center;
    gap: 14px;
    margin: 0 0 22px;
    color: var(--okolo-black);
    font-size: 16px;
    font-weight: 800;
    line-height: 1.25;
    text-transform: uppercase;
  }

  .okolo-step-number {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex: 0 0 31px;
    width: 31px;
    height: 31px;
    border-radius: 999px;
    background: var(--okolo-black);
    color: #fff;
    font-size: 14px;
    font-weight: 800;
  }

  .okolo-field {
    position: relative;
    margin: 0 0 17px;
  }

  .okolo-field label,
  .okolo-field-label {
    display: block;
    margin: 0 0 9px;
    color: #2a2a2a;
    font-size: 13px;
    font-weight: 600;
    line-height: 1.35;
  }

  .okolo-input,
  .okolo-textarea,
  .okolo-promo-input {
    width: 100%;
    min-height: 45px;
    padding: 13px 14px;
    border: 1px solid var(--okolo-line);
    border-radius: var(--okolo-radius);
    background: #fff;
    color: var(--okolo-text);
    font-family: inherit;
    font-size: 14px;
    line-height: 1.4;
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  .okolo-textarea {
    min-height: 74px;
    resize: vertical;
  }

  .okolo-input::placeholder,
  .okolo-textarea::placeholder,
  .okolo-promo-input::placeholder {
    color: #b8b8b8;
  }

  .okolo-input:focus,
  .okolo-textarea:focus,
  .okolo-promo-input:focus {
    border-color: #9f9f9f;
    box-shadow: 0 0 0 1px #9f9f9f;
  }

  .okolo-input.is-invalid,
  .okolo-textarea.is-invalid {
    border-color: var(--okolo-error);
    box-shadow: 0 0 0 1px rgba(198, 40, 40, 0.16);
  }

  .okolo-field-error {
    display: none;
    margin-top: 6px;
    color: var(--okolo-error);
    font-size: 12px;
    line-height: 1.35;
  }

  .okolo-field-error.is-visible {
    display: block;
  }

  .okolo-options {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 9px;
  }

  .okolo-option {
    position: relative;
    display: flex;
    gap: 13px;
    align-items: flex-start;
    min-height: 74px;
    padding: 16px 18px;
    border: 1px solid var(--okolo-line);
    background: #fff;
    color: var(--okolo-text);
    cursor: pointer;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  .okolo-option input {
    position: absolute;
    opacity: 0;
    pointer-events: none;
  }

  .okolo-option-marker {
    position: relative;
    flex: 0 0 18px;
    width: 18px;
    height: 18px;
    margin-top: 2px;
    border: 2px solid #d9d9d9;
    border-radius: 999px;
    background: #fff;
  }

  .okolo-option-marker::after {
    content: "";
    position: absolute;
    inset: 4px;
    border-radius: 999px;
    background: var(--okolo-black);
    opacity: 0;
  }

  .okolo-option input:checked + .okolo-option-marker {
    border-color: var(--okolo-black);
  }

  .okolo-option input:checked + .okolo-option-marker::after {
    opacity: 1;
  }

  .okolo-option:has(input:checked) {
    border-color: var(--okolo-black);
    box-shadow: inset 0 0 0 1px var(--okolo-black);
  }

  .okolo-option-title {
    display: block;
    margin-bottom: 4px;
    color: var(--okolo-black);
    font-size: 14px;
    font-weight: 800;
    line-height: 1.3;
  }

  .okolo-option-note {
    display: block;
    color: #606060;
    font-size: 12px;
    line-height: 1.35;
  }

  .okolo-single-option {
    grid-template-columns: 1fr;
  }

  .okolo-suggestions {
    position: absolute;
    z-index: 20;
    top: calc(100% + 6px);
    left: 0;
    right: 0;
    max-height: 265px;
    overflow: auto;
    border: 1px solid var(--okolo-line);
    background: #fff;
    box-shadow: 0 18px 38px rgba(0, 0, 0, 0.08);
  }

  .okolo-suggestion {
    display: block;
    width: 100%;
    padding: 12px 14px;
    border: 0;
    border-bottom: 1px solid #f0f0f0;
    background: #fff;
    color: var(--okolo-text);
    font-family: inherit;
    font-size: 14px;
    line-height: 1.35;
    text-align: left;
    cursor: pointer;
  }

  .okolo-suggestion:hover,
  .okolo-suggestion:focus {
    background: var(--okolo-soft);
    outline: none;
  }

  .okolo-suggestion small {
    display: block;
    margin-top: 3px;
    color: var(--okolo-muted);
    font-size: 12px;
  }

  .okolo-consent {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    margin: 24px 0 18px;
    color: #454545;
    font-size: 12px;
    line-height: 1.45;
  }

  .okolo-consent input {
    width: 18px;
    height: 18px;
    margin: 0;
    accent-color: var(--okolo-black);
  }

  .okolo-submit {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-height: 58px;
    border: 1px solid var(--okolo-black);
    border-radius: var(--okolo-radius);
    background: var(--okolo-black);
    color: #fff;
    font-family: inherit;
    font-size: 15px;
    font-weight: 800;
    line-height: 1;
    text-transform: uppercase;
    cursor: pointer;
    transition: opacity 0.15s ease, transform 0.15s ease;
  }

  .okolo-submit:hover {
    opacity: 0.9;
  }

  .okolo-submit:active {
    transform: translateY(1px);
  }

  .okolo-submit:disabled {
    cursor: not-allowed;
    opacity: 0.45;
  }

  .okolo-form-status {
    min-height: 20px;
    margin-top: 12px;
    color: var(--okolo-muted);
    font-size: 13px;
    line-height: 1.4;
    text-align: center;
  }

  .okolo-form-status.is-error {
    color: var(--okolo-error);
  }

  .okolo-form-status.is-success {
    color: var(--okolo-success);
  }

  .okolo-secure {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    margin-top: 10px;
    color: #8a8a8a;
    font-size: 12px;
  }

  .okolo-summary {
    position: sticky;
    top: 26px;
    min-width: 0;
    padding: 31px 34px 34px;
    border: 1px solid var(--okolo-line);
    background: #fff;
  }

  .okolo-summary h2 {
    margin: 0 0 31px;
    color: var(--okolo-black);
    font-size: 16px;
    font-weight: 800;
    line-height: 1.3;
    text-transform: uppercase;
  }

  .okolo-products {
    display: grid;
    gap: 24px;
  }

  .okolo-product {
    display: grid;
    grid-template-columns: 106px minmax(0, 1fr) auto;
    gap: 24px;
    align-items: center;
  }

  .okolo-product-image {
    display: block;
    width: 106px;
    height: 137px;
    overflow: hidden;
    background: #efefef;
  }

  .okolo-product-image img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .okolo-product-placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 106px;
    height: 137px;
    background: #efefef;
    color: #9b9b9b;
    font-size: 12px;
  }

  .okolo-product-name {
    margin: 0 0 7px;
    color: var(--okolo-black);
    font-size: 14px;
    font-weight: 700;
    line-height: 1.42;
  }

  .okolo-product-variant {
    margin: 0 0 29px;
    color: #1f1f1f;
    font-size: 13px;
    line-height: 1.45;
  }

  .okolo-product-qty {
    color: #626262;
    font-size: 13px;
    line-height: 1.35;
  }

  .okolo-product-price {
    color: var(--okolo-black);
    font-size: 15px;
    font-weight: 800;
    line-height: 1.3;
    white-space: nowrap;
  }

  .okolo-empty-cart {
    margin: 0;
    padding: 18px 0;
    color: var(--okolo-muted);
    font-size: 14px;
    line-height: 1.45;
  }

  .okolo-promo {
    margin: 30px 0 0;
    border-top: 1px solid var(--okolo-line);
    border-bottom: 1px solid var(--okolo-line);
  }

  .okolo-promo-toggle {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    min-height: 74px;
    padding: 0;
    border: 0;
    background: transparent;
    color: #383838;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    line-height: 1.3;
    cursor: pointer;
  }

  .okolo-promo-chevron {
    width: 9px;
    height: 9px;
    border-right: 2px solid #7d7d7d;
    border-bottom: 2px solid #7d7d7d;
    transform: rotate(45deg);
    transition: transform 0.15s ease;
  }

  .okolo-promo-toggle[aria-expanded="true"] .okolo-promo-chevron {
    transform: rotate(225deg);
  }

  .okolo-promo-panel {
    display: none;
    padding: 0 0 18px;
  }

  .okolo-promo-panel.is-open {
    display: block;
  }

  .okolo-promo-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 132px;
    gap: 8px;
  }

  .okolo-promo-button {
    border: 1px solid var(--okolo-black);
    background: var(--okolo-black);
    color: #fff;
    font-family: inherit;
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
    cursor: pointer;
  }

  .okolo-promo-note {
    margin: 8px 0 0;
    color: var(--okolo-muted);
    font-size: 12px;
    line-height: 1.4;
  }

  .okolo-totals {
    display: grid;
    gap: 18px;
    margin-top: 28px;
  }

  .okolo-total-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    color: #4f4f4f;
    font-size: 14px;
    line-height: 1.35;
  }

  .okolo-total-row strong {
    color: var(--okolo-black);
    font-size: 16px;
    font-weight: 800;
    white-space: nowrap;
  }

  .okolo-total-row.okolo-grand-total {
    margin-top: 9px;
    color: var(--okolo-black);
    font-weight: 800;
  }

  .okolo-total-row.okolo-grand-total strong {
    font-size: 20px;
  }

  @media (max-width: 1020px) {
    .okolo-checkout {
      padding: 32px 22px 48px;
    }

    .okolo-layout {
      grid-template-columns: 1fr;
      gap: 34px;
    }

    .okolo-summary {
      position: static;
      padding: 25px 22px 28px;
    }
  }

  @media (max-width: 680px) {
    .okolo-checkout {
      padding: 24px 16px 42px;
    }

    .okolo-breadcrumbs {
      margin-bottom: 24px;
      font-size: 12px;
    }

    .okolo-checkout h1 {
      font-size: 24px;
      margin-bottom: 24px;
    }

    .okolo-step {
      margin-bottom: 28px;
    }

    .okolo-options {
      grid-template-columns: 1fr;
    }

    .okolo-option {
      min-height: 68px;
      padding: 14px 15px;
    }

    .okolo-product {
      grid-template-columns: 82px minmax(0, 1fr);
      gap: 15px;
      align-items: start;
    }

    .okolo-product-image,
    .okolo-product-placeholder {
      width: 82px;
      height: 106px;
    }

    .okolo-product-price {
      grid-column: 2;
      justify-self: start;
      margin-top: -16px;
    }

    .okolo-product-variant {
      margin-bottom: 18px;
    }

    .okolo-promo-row {
      grid-template-columns: 1fr;
    }

    .okolo-promo-button {
      min-height: 44px;
    }
  }
</style>

<section class="okolo-checkout" aria-label="Оформлення замовлення Okolo">
  <nav class="okolo-breadcrumbs" aria-label="Навігація">
    <span>Головна</span>
    <span>›</span>
    <span>Кошик</span>
    <span>›</span>
    <span>Оформлення замовлення</span>
  </nav>

  <h1>Оформлення замовлення</h1>

  <div class="okolo-layout">
    <form class="okolo-form" id="okoloOrderForm" novalidate>
      <fieldset class="okolo-step">
        <legend class="okolo-step-heading">
          <span class="okolo-step-number">1</span>
          <span>Контактні дані</span>
        </legend>

        <div class="okolo-field">
          <label for="okolo-full-name">Ім'я та прізвище *</label>
          <input class="okolo-input" id="okolo-full-name" name="full_name" type="text" autocomplete="name" placeholder="Введіть ім'я та прізвище" required>
          <div class="okolo-field-error" data-error-for="okolo-full-name"></div>
        </div>

        <div class="okolo-field">
          <label for="okolo-phone">Телефон *</label>
          <input class="okolo-input" id="okolo-phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="+380 (__) ___-__-__" required>
          <div class="okolo-field-error" data-error-for="okolo-phone"></div>
        </div>

        <div class="okolo-field">
          <label for="okolo-email">Email (необов'язково)</label>
          <input class="okolo-input" id="okolo-email" name="email" type="email" autocomplete="email" placeholder="example@gmail.com">
          <div class="okolo-field-error" data-error-for="okolo-email"></div>
        </div>

        <div class="okolo-field">
          <label for="okolo-instagram">Instagram/ Telegram</label>
          <input class="okolo-input" id="okolo-instagram" name="instagram" type="text" autocomplete="off" placeholder="@username">
        </div>

        <div class="okolo-field">
          <span class="okolo-field-label">Як з Вами зв'язатись?</span>
          <div class="okolo-options">
            <label class="okolo-option">
              <input type="radio" name="contact_method" value="message" checked>
              <span class="okolo-option-marker" aria-hidden="true"></span>
              <span>
                <span class="okolo-option-title">Напишіть мені</span>
                <span class="okolo-option-note">Instagram або месенджер</span>
              </span>
            </label>

            <label class="okolo-option">
              <input type="radio" name="contact_method" value="call">
              <span class="okolo-option-marker" aria-hidden="true"></span>
              <span>
                <span class="okolo-option-title">Зателефонуйте мені</span>
                <span class="okolo-option-note">Менеджер уточнить деталі</span>
              </span>
            </label>
          </div>
        </div>
      </fieldset>

      <fieldset class="okolo-step">
        <legend class="okolo-step-heading">
          <span class="okolo-step-number">2</span>
          <span>Нова пошта</span>
        </legend>

        <div class="okolo-field">
          <label for="okolo-city">Місто *</label>
          <input class="okolo-input" id="okolo-city" name="city" type="text" autocomplete="off" placeholder="Введіть місто" required>
          <div class="okolo-suggestions" id="okolo-city-suggestions" hidden></div>
          <div class="okolo-field-error" data-error-for="okolo-city"></div>
        </div>

        <div class="okolo-field">
          <span class="okolo-field-label">Спосіб доставки</span>
          <div class="okolo-options">
            <label class="okolo-option">
              <input type="radio" name="delivery_method" value="branch" checked>
              <span class="okolo-option-marker" aria-hidden="true"></span>
              <span>
                <span class="okolo-option-title">Відділення</span>
                <span class="okolo-option-note">Отримання у відділенні Нової пошти</span>
              </span>
            </label>

            <label class="okolo-option">
              <input type="radio" name="delivery_method" value="postomat">
              <span class="okolo-option-marker" aria-hidden="true"></span>
              <span>
                <span class="okolo-option-title">Поштомат</span>
                <span class="okolo-option-note">Отримання у поштоматі Нової пошти</span>
              </span>
            </label>
          </div>
        </div>

        <div class="okolo-field">
          <label for="okolo-warehouse" id="okolo-warehouse-label">Відділення *</label>
          <input class="okolo-input" id="okolo-warehouse" name="warehouse" type="text" autocomplete="off" placeholder="Оберіть відділення" disabled required>
          <div class="okolo-suggestions" id="okolo-warehouse-suggestions" hidden></div>
          <div class="okolo-field-error" data-error-for="okolo-warehouse"></div>
        </div>

        <div class="okolo-field">
          <label for="okolo-comment">Коментар до доставки (необов'язково)</label>
          <textarea class="okolo-textarea" id="okolo-comment" name="comment" rows="3" placeholder="Наприклад: зателефонувати перед доставкою"></textarea>
        </div>
      </fieldset>

      <fieldset class="okolo-step">
        <legend class="okolo-step-heading">
          <span class="okolo-step-number">3</span>
          <span>Оплата</span>
        </legend>

        <div class="okolo-options">
          <label class="okolo-option">
            <input type="radio" name="payment_type" value="no_prepayment" checked>
            <span class="okolo-option-marker" aria-hidden="true"></span>
            <span>
              <span class="okolo-option-title">Післяплата</span>
              <span class="okolo-option-note">Наш менеджер зв'яжеться з Вами для проведення мінімальної передплати 200 грн</span>
              <span class="okolo-option-note">Решта суми оплачується при отриманні через Нову пошту</span>
            </span>
          </label>

          <label class="okolo-option">
            <input type="radio" name="payment_type" value="full">
            <span class="okolo-option-marker" aria-hidden="true"></span>
            <span>
              <span class="okolo-option-title">Повна оплата</span>
              <span class="okolo-option-note">Реквізити для оплати з'являться на наступній сторінці</span>
            </span>
          </label>
        </div>
      </fieldset>

      <label class="okolo-consent">
        <input id="okolo-consent" type="checkbox" required>
        <span>Я ознайомлений(-на) з умовами обміну та повернення і погоджуюсь на обробку персональних даних</span>
      </label>

      <button class="okolo-submit" id="okolo-submit" type="submit">Підтвердити замовлення</button>
      <div class="okolo-form-status" id="okolo-form-status" role="status" aria-live="polite"></div>
      <div class="okolo-secure" aria-hidden="true">Ваші дані під захистом</div>
    </form>

    <aside class="okolo-summary" aria-label="Ваше замовлення">
      <h2>Ваше замовлення (<span id="okolo-items-count">0</span>)</h2>
      <div class="okolo-products" id="okolo-products"></div>

      <div class="okolo-promo">
        <button class="okolo-promo-toggle" id="okolo-promo-toggle" type="button" aria-expanded="false" aria-controls="okolo-promo-panel">
          <span>Промокод</span>
          <span class="okolo-promo-chevron" aria-hidden="true"></span>
        </button>
        <div class="okolo-promo-panel" id="okolo-promo-panel">
          <div class="okolo-promo-row">
            <input class="okolo-promo-input" id="okolo-promo-code" type="text" placeholder="Введіть промокод">
            <button class="okolo-promo-button" id="okolo-promo-apply" type="button">Застосувати</button>
          </div>
          <p class="okolo-promo-note" id="okolo-promo-note">Промокод буде перевірений менеджером при підтвердженні замовлення.</p>
        </div>
      </div>

      <div class="okolo-totals">
        <div class="okolo-total-row">
          <span>Товари (<span id="okolo-total-items">0</span>)</span>
          <strong id="okolo-subtotal">0 грн</strong>
        </div>
        <div class="okolo-total-row okolo-grand-total">
          <span>Всього до сплати</span>
          <strong id="okolo-grand-total">0 грн</strong>
        </div>
      </div>
    </aside>
  </div>
</section>

<script>
  window.OKOLO_CHECKOUT_LOCALE = '{{ localization.language.iso_code }}';
</script>

<script>
(function () {
  const API_BASE_URL = 'https://okolo-mono.onrender.com';
  const FULL_PAYMENT_URL = window.OKOLO_FULL_PAYMENT_URL || '/pages/okolo-payment';
  const TRACKING_STORAGE_KEY = 'okolo_tracking';
  const TRACKING_PARAMS = [
    'utm_source',
    'utm_medium',
    'utm_campaign',
    'utm_content',
    'utm_term',
    'utm_lang',
    'gclid',
    'gbraid',
    'wbraid',
    'fbclid',
    'ttclid',
    'msclkid',
  ];

  const form = document.getElementById('okoloOrderForm');
  const submitButton = document.getElementById('okolo-submit');
  const statusEl = document.getElementById('okolo-form-status');
  const productsEl = document.getElementById('okolo-products');
  const itemsCountEl = document.getElementById('okolo-items-count');
  const totalItemsEl = document.getElementById('okolo-total-items');
  const subtotalEl = document.getElementById('okolo-subtotal');
  const grandTotalEl = document.getElementById('okolo-grand-total');
  const cityInput = document.getElementById('okolo-city');
  const warehouseInput = document.getElementById('okolo-warehouse');
  const warehouseLabel = document.getElementById('okolo-warehouse-label');
  const citySuggestions = document.getElementById('okolo-city-suggestions');
  const warehouseSuggestions = document.getElementById('okolo-warehouse-suggestions');
  const deliveryMethodInputs = Array.from(document.querySelectorAll('input[name="delivery_method"]'));
  const promoToggle = document.getElementById('okolo-promo-toggle');
  const promoPanel = document.getElementById('okolo-promo-panel');
  const promoApply = document.getElementById('okolo-promo-apply');
  const promoNote = document.getElementById('okolo-promo-note');

  const state = {
    cart: null,
    selectedCity: null,
    selectedWarehouse: null,
    cityRequestId: 0,
    warehouseRequestId: 0,
    isSubmitting: false,
  };

  if (!form || !submitButton) return;

  function getShopifyRoot() {
    const root = (window.Shopify && window.Shopify.routes && window.Shopify.routes.root) || '/';
    return root.endsWith('/') ? root : root + '/';
  }

  function shopifyUrl(path) {
    return getShopifyRoot() + String(path || '').replace(/^\//, '');
  }

  function normalizeText(value) {
    return String(value || '').replace(/\s+/g, ' ').trim();
  }

  function normalizePhone(value) {
    const cleaned = String(value || '').replace(/[^\d+]/g, '');
    const digits = cleaned.replace(/\D/g, '');
    if (cleaned.startsWith('+')) return `+${digits}`;
    if (digits.startsWith('380')) return `+${digits}`;
    if (digits.startsWith('0')) return `+38${digits}`;
    return digits ? `+${digits}` : '';
  }

  function centsToUah(cents) {
    return Math.round((Number(cents) || 0) / 100);
  }

  function formatUah(amount) {
    return `${Math.round(Number(amount) || 0).toLocaleString('uk-UA')} грн`;
  }

  function escapeHtml(value) {
    return String(value || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  function normalizeImageUrl(url) {
    const value = String(url || '').trim();
    if (!value) return '';
    return value.startsWith('//') ? `https:${value}` : value;
  }

  function setStatus(message, type) {
    statusEl.textContent = message || '';
    statusEl.classList.toggle('is-error', type === 'error');
    statusEl.classList.toggle('is-success', type === 'success');
  }

  function fieldError(input, message) {
    const error = form.querySelector(`[data-error-for="${input.id}"]`);
    input.classList.toggle('is-invalid', Boolean(message));
    if (error) {
      error.textContent = message || '';
      error.classList.toggle('is-visible', Boolean(message));
    }
  }

  function clearFieldError(input) {
    fieldError(input, '');
  }

  function debounce(fn, delay) {
    let timer = 0;
    return function () {
      const args = arguments;
      window.clearTimeout(timer);
      timer = window.setTimeout(function () {
        fn.apply(null, args);
      }, delay);
    };
  }

  async function apiGet(path) {
    const response = await fetch(`${API_BASE_URL}${path}`, {
      headers: { Accept: 'application/json' },
    });
    const data = await response.json().catch(function () {
      return {};
    });
    if (!response.ok) throw new Error(data.message || data.error || 'Помилка запиту');
    return data;
  }

  function hideSuggestions(container) {
    container.hidden = true;
    container.innerHTML = '';
  }

  function renderSuggestionMessage(container, message) {
    container.innerHTML = `<div class="okolo-suggestion" role="status">${escapeHtml(message)}</div>`;
    container.hidden = false;
  }

  function getSelectedDeliveryMethod() {
    const checked = form.querySelector('input[name="delivery_method"]:checked');
    return checked && checked.value === 'postomat' ? 'postomat' : 'branch';
  }

  function getDeliveryTargetLabel() {
    return getSelectedDeliveryMethod() === 'postomat' ? 'Поштомат' : 'Відділення';
  }

  function updateDeliveryMethodUi(options) {
    const shouldResetWarehouse = !options || options.resetWarehouse !== false;
    const targetLabel = getDeliveryTargetLabel();
    if (warehouseLabel) warehouseLabel.textContent = `${targetLabel} *`;
    warehouseInput.placeholder = `Оберіть ${targetLabel.toLocaleLowerCase('uk-UA')}`;

    if (shouldResetWarehouse) {
      state.selectedWarehouse = null;
      warehouseInput.value = '';
      hideSuggestions(warehouseSuggestions);
      clearFieldError(warehouseInput);
    }
  }

  function warehouseMatchesDeliveryMethod(warehouse) {
    const name = String(warehouse?.name || '');
    const isPostomat = /поштомат/i.test(name);
    return getSelectedDeliveryMethod() === 'postomat' ? isPostomat : !isPostomat;
  }

  function renderCitySuggestions(cities) {
    if (!cities.length) {
      renderSuggestionMessage(citySuggestions, 'Місто не знайдено');
      return;
    }

    citySuggestions.innerHTML = cities.map(function (city, index) {
      const label = [city.name, city.area].filter(Boolean).join(', ');
      const meta = city.settlementType || city.area || '';
      return `<button class="okolo-suggestion" type="button" data-city-index="${index}">
        ${escapeHtml(label)}
        ${meta ? `<small>${escapeHtml(meta)}</small>` : ''}
      </button>`;
    }).join('');
    citySuggestions.hidden = false;
    citySuggestions._items = cities;
  }

  function renderWarehouseSuggestions(warehouses) {
    const filteredWarehouses = warehouses.filter(warehouseMatchesDeliveryMethod);
    const targetLabel = getDeliveryTargetLabel();

    if (!filteredWarehouses.length) {
      renderSuggestionMessage(warehouseSuggestions, `${targetLabel} не знайдено`);
      return;
    }

    warehouseSuggestions.innerHTML = filteredWarehouses.map(function (warehouse, index) {
      return `<button class="okolo-suggestion" type="button" data-warehouse-index="${index}">
        ${escapeHtml(warehouse.name)}
      </button>`;
    }).join('');
    warehouseSuggestions.hidden = false;
    warehouseSuggestions._items = filteredWarehouses;
  }

  const searchCities = debounce(async function () {
    const query = normalizeText(cityInput.value);
    state.selectedCity = null;
    state.selectedWarehouse = null;
    warehouseInput.value = '';
    warehouseInput.disabled = true;
    hideSuggestions(warehouseSuggestions);

    if (query.length < 2) {
      hideSuggestions(citySuggestions);
      return;
    }

    const requestId = ++state.cityRequestId;
    renderSuggestionMessage(citySuggestions, 'Шукаємо місто...');
    try {
      const data = await apiGet(`/api/np/cities?query=${encodeURIComponent(query)}&rid=okolo-city-${Date.now()}`);
      if (requestId !== state.cityRequestId) return;
      renderCitySuggestions(Array.isArray(data.cities) ? data.cities : []);
    } catch (error) {
      if (requestId !== state.cityRequestId) return;
      renderSuggestionMessage(citySuggestions, 'Не вдалося завантажити міста');
    }
  }, 260);

  const searchWarehouses = debounce(async function () {
    if (!state.selectedCity) return;
    const query = normalizeText(warehouseInput.value);
    const targetLabel = getDeliveryTargetLabel();
    const apiQuery = getSelectedDeliveryMethod() === 'postomat' && !query ? 'поштомат' : query;
    const requestId = ++state.warehouseRequestId;
    renderSuggestionMessage(warehouseSuggestions, `Шукаємо ${targetLabel.toLocaleLowerCase('uk-UA')}...`);

    try {
      const params = new URLSearchParams({
        city: state.selectedCity.name || cityInput.value,
        cityRef: state.selectedCity.ref || '',
        query: apiQuery,
        rid: `okolo-warehouse-${Date.now()}`,
      });
      const data = await apiGet(`/api/np/warehouses?${params.toString()}`);
      if (requestId !== state.warehouseRequestId) return;
      renderWarehouseSuggestions(Array.isArray(data.warehouses) ? data.warehouses : []);
    } catch (error) {
      if (requestId !== state.warehouseRequestId) return;
      renderSuggestionMessage(warehouseSuggestions, `Не вдалося завантажити ${targetLabel.toLocaleLowerCase('uk-UA')}`);
    }
  }, 260);

  function selectCity(city) {
    state.selectedCity = city;
    state.selectedWarehouse = null;
    cityInput.value = [city.name, city.area].filter(Boolean).join(', ');
    warehouseInput.value = '';
    warehouseInput.disabled = false;
    updateDeliveryMethodUi({ resetWarehouse: false });
    warehouseInput.focus();
    clearFieldError(cityInput);
    hideSuggestions(citySuggestions);
    searchWarehouses();
  }

  function selectWarehouse(warehouse) {
    state.selectedWarehouse = warehouse;
    warehouseInput.value = warehouse.name || '';
    clearFieldError(warehouseInput);
    hideSuggestions(warehouseSuggestions);
  }

  function cleanVariantTitle(item) {
    const value = normalizeText(item.variant_title || '');
    if (!value || value === 'Default Title') return '';
    return value.replace(/\s*\/\s*/g, ' / ');
  }

  function renderCart() {
    const cart = state.cart || { items: [], item_count: 0, total_price: 0 };
    const items = Array.isArray(cart.items) ? cart.items : [];
    const subtotal = centsToUah(cart.items_subtotal_price || cart.total_price || 0);
    itemsCountEl.textContent = String(cart.item_count || 0);
    totalItemsEl.textContent = String(cart.item_count || 0);
    subtotalEl.textContent = formatUah(subtotal);
    grandTotalEl.textContent = formatUah(subtotal);

    if (!items.length) {
      productsEl.innerHTML = '<p class="okolo-empty-cart">Кошик порожній. Додайте товар, щоб оформити замовлення.</p>';
      submitButton.disabled = true;
      return;
    }

    submitButton.disabled = false;
    productsEl.innerHTML = items.map(function (item) {
      const imageUrl = normalizeImageUrl((item.featured_image && item.featured_image.url) || item.image);
      const productUrl = item.url ? shopifyUrl(String(item.url).replace(/^\//, '')) : '';
      const name = item.product_title || item.title || 'Товар';
      const variant = cleanVariantTitle(item);
      const linePrice = centsToUah(item.final_line_price || item.line_price || 0);
      const image = imageUrl
        ? `<span class="okolo-product-image"><img src="${escapeHtml(imageUrl)}" alt="${escapeHtml(name)}" loading="lazy"></span>`
        : '<span class="okolo-product-placeholder">Фото</span>';
      const imageBlock = productUrl
        ? `<a href="${escapeHtml(productUrl)}" class="okolo-product-image-link">${image}</a>`
        : image;

      return `<article class="okolo-product">
        ${imageBlock}
        <div>
          <p class="okolo-product-name">${escapeHtml(name)}</p>
          ${variant ? `<p class="okolo-product-variant">${escapeHtml(variant)}</p>` : '<p class="okolo-product-variant"></p>'}
          <div class="okolo-product-qty">Кількість: ${Number(item.quantity || 1)}</div>
        </div>
        <div class="okolo-product-price">${formatUah(linePrice)}</div>
      </article>`;
    }).join('');
  }

  async function loadCart() {
    try {
      const response = await fetch(shopifyUrl('cart.js'), {
        headers: { Accept: 'application/json' },
        credentials: 'same-origin',
      });
      if (!response.ok) throw new Error('Cart unavailable');
      state.cart = await response.json();
      renderCart();
    } catch (error) {
      productsEl.innerHTML = '<p class="okolo-empty-cart">Не вдалося завантажити кошик. Оновіть сторінку і спробуйте ще раз.</p>';
      submitButton.disabled = true;
      setStatus('Кошик Shopify недоступний.', 'error');
    }
  }

  function splitName(fullName) {
    const parts = normalizeText(fullName).split(' ').filter(Boolean);
    return {
      first_name: parts.shift() || '',
      last_name: parts.join(' '),
    };
  }

  function getSelectedContactLabel() {
    const value = (form.querySelector('input[name="contact_method"]:checked') || {}).value;
    return value === 'call' ? 'Зателефонуйте мені' : 'Напишіть мені';
  }

  function getSelectedPaymentType() {
    const value = (form.querySelector('input[name="payment_type"]:checked') || {}).value;
    return value === 'full' ? 'full' : 'no_prepayment';
  }

  function getSelectedPaymentLabel() {
    return getSelectedPaymentType() === 'full' ? 'Повна оплата' : 'Післяплата';
  }

  function readJsonStorage(key) {
    try {
      return JSON.parse(localStorage.getItem(key) || '{}') || {};
    } catch (error) {
      return {};
    }
  }

  function writeJsonStorage(key, value) {
    try {
      localStorage.setItem(key, JSON.stringify(value));
    } catch (error) {
      // Tracking should never block checkout.
    }
  }

  function isTrackingParamName(name) {
    return TRACKING_PARAMS.includes(name) || String(name || '').startsWith('utm_');
  }

  function getCookie(name) {
    const escapedName = name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const match = document.cookie.match(new RegExp(`(?:^|; )${escapedName}=([^;]*)`));
    return match ? decodeURIComponent(match[1]) : '';
  }

  function getCookieByPrefix(prefix) {
    return document.cookie
      .split(';')
      .map(function (item) { return item.trim(); })
      .find(function (item) { return item.indexOf(prefix) === 0; })
      ?.split('=')
      .slice(1)
      .join('=') || '';
  }

  function normalizeGaClientId(value) {
    const raw = String(value || '').trim();
    if (!raw) return '';
    if (/^GA\d+\.\d+\./.test(raw)) return raw.split('.').slice(2).join('.');
    return raw;
  }

  function normalizeGaSessionId(value) {
    const raw = String(value || '').trim();
    if (!raw) return '';
    const prefixedMatch = raw.match(/(?:^|[.$])s(\d{8,})(?:[$.]|$)/);
    if (prefixedMatch && prefixedMatch[1]) return prefixedMatch[1];
    if (/^GS\d+\.\d+\./.test(raw)) return raw.split('.')[2] || '';
    return raw;
  }

  function trafficSourceFromText(value) {
    const text = String(value || '').toLocaleLowerCase('uk-UA');
    if (/instagram|(^|\W)ig($|\W)/i.test(text)) return 'Instagram';
    if (/facebook|(^|\W)fb($|\W)/i.test(text)) return 'Facebook';
    if (/google/i.test(text)) return 'Google';
    if (/tiktok|(^|\W)tt($|\W)/i.test(text)) return 'TikTok';
    return '';
  }

  function detectTrafficSource(tracking) {
    return trafficSourceFromText(tracking.traffic_source)
      || trafficSourceFromText(`${tracking.utm_source || ''} ${tracking.referrer || ''}`)
      || (tracking.gclid || tracking.gbraid || tracking.wbraid ? 'Google' : '')
      || (tracking.fbclid || tracking.fbc ? 'Facebook' : '')
      || (tracking.ttclid ? 'TikTok' : '')
      || humanTrackingValue(tracking.utm_source)
      || '';
  }

  function humanTrackingValue(value) {
    const text = normalizeText(value);
    if (!text) return '';
    if (/^[\d\s._-]+$/.test(text)) return '';
    if (text.length > 120) return '';
    return text;
  }

  function trackingLine(label, value) {
    const text = humanTrackingValue(value);
    return text ? `${label}: ${text}` : '';
  }

  function buildTrackingComment(tracking) {
    const source = detectTrafficSource(tracking);
    const lines = [
      source,
      trackingLine('UTM source', tracking.utm_source),
      trackingLine('UTM medium', tracking.utm_medium),
      trackingLine('UTM campaign', tracking.utm_campaign),
      trackingLine('UTM content', tracking.utm_content),
      trackingLine('UTM term', tracking.utm_term),
    ].filter(Boolean);

    return lines.length ? ['ЗВІДКИ КЛІЄНТ', ...lines].join('\n') : '';
  }

  function readTracking() {
    const params = new URLSearchParams(window.location.search);
    const saved = readJsonStorage(TRACKING_STORAGE_KEY);
    const gaCookie = getCookie('_ga') || saved.ga_cookie || '';
    const gaSessionCookie = getCookieByPrefix('_ga_') || saved.ga_session_cookie || '';
    const tracking = {
      ...saved,
      page_url: window.location.href,
      referrer: saved.referrer || document.referrer || '',
      landing_page: saved.landing_page || window.location.href,
      user_agent: navigator.userAgent || '',
      fbp: getCookie('_fbp') || saved.fbp || '',
      fbc: getCookie('_fbc') || saved.fbc || '',
      ga_cookie: gaCookie,
      ga_client_id: normalizeGaClientId(gaCookie) || saved.ga_client_id || '',
      ga_session_cookie: gaSessionCookie,
      ga_session_id: normalizeGaSessionId(gaSessionCookie) || saved.ga_session_id || '',
      gcl_aw: getCookie('_gcl_aw') || saved.gcl_aw || '',
      gcl_au: getCookie('_gcl_au') || saved.gcl_au || '',
    };

    let hasFreshTracking = false;
    params.forEach(function (value, name) {
      if (value && isTrackingParamName(name)) {
        tracking[name] = value;
        hasFreshTracking = true;
      }
    });

    tracking.traffic_source = detectTrafficSource(tracking);
    if (hasFreshTracking || !saved.landing_page) writeJsonStorage(TRACKING_STORAGE_KEY, tracking);

    return tracking;
  }

  function cartGoods() {
    const items = (state.cart && Array.isArray(state.cart.items)) ? state.cart.items : [];
    return items.map(function (item) {
      const properties = Object.entries(item.properties || {})
        .filter(function (entry) {
          return entry[1] && !String(entry[0]).startsWith('_');
        })
        .map(function (entry) {
          return { name: entry[0], value: String(entry[1]) };
        });

      return {
        code: item.sku || item.variant_id || item.id || item.key || '',
        variant_id: item.variant_id || item.id || '',
        variant_title: cleanVariantTitle(item),
        name: item.product_title || item.title || 'Товар',
        title: item.title || item.product_title || 'Товар',
        price: centsToUah(item.final_price || item.price || 0),
        quantity: Number(item.quantity || 1),
        properties,
      };
    });
  }

  function validateForm() {
    const fullName = document.getElementById('okolo-full-name');
    const phone = document.getElementById('okolo-phone');
    const email = document.getElementById('okolo-email');
    const consent = document.getElementById('okolo-consent');
    let valid = true;

    [fullName, phone, email, cityInput, warehouseInput].forEach(clearFieldError);
    setStatus('', '');

    if (!normalizeText(fullName.value)) {
      fieldError(fullName, "Введіть ім'я та прізвище");
      valid = false;
    }

    if (normalizePhone(phone.value).replace(/\D/g, '').length < 10) {
      fieldError(phone, 'Введіть коректний номер телефону');
      valid = false;
    }

    const emailValue = normalizeText(email.value);
    if (emailValue && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailValue)) {
      fieldError(email, 'Введіть коректний e-mail або залиште поле порожнім');
      valid = false;
    }

    if (!state.selectedCity) {
      fieldError(cityInput, 'Оберіть місто зі списку');
      valid = false;
    }

    if (!state.selectedWarehouse) {
      fieldError(warehouseInput, `Оберіть ${getDeliveryTargetLabel().toLocaleLowerCase('uk-UA')} зі списку`);
      valid = false;
    }

    if (!consent.checked) {
      setStatus('Підтвердіть згоду на обробку персональних даних.', 'error');
      valid = false;
    }

    if (!state.cart || !Array.isArray(state.cart.items) || state.cart.items.length === 0) {
      setStatus('Кошик порожній. Додайте товар перед оформленням.', 'error');
      valid = false;
    }

    return valid;
  }

  function buildPayload() {
    const fullName = document.getElementById('okolo-full-name').value;
    const phone = document.getElementById('okolo-phone').value;
    const email = document.getElementById('okolo-email').value;
    const instagram = normalizeText(document.getElementById('okolo-instagram').value);
    const comment = normalizeText(document.getElementById('okolo-comment').value);
    const name = splitName(fullName);
    const subtotal = centsToUah((state.cart && (state.cart.items_subtotal_price || state.cart.total_price)) || 0);
    const contactLabel = getSelectedContactLabel();
    const deliveryTarget = getDeliveryTargetLabel().toLocaleLowerCase('uk-UA');
    const paymentType = getSelectedPaymentType();
    const paymentComment = paymentType === 'full'
      ? "Оплата: повна оплата за реквізитами. Реквізити з'являться на наступній сторінці"
      : "Передплата: менеджер зв'яжеться для проведення мінімальної передплати 200 грн";
    const tracking = readTracking();
    const trackingComment = buildTrackingComment(tracking);
    const commentParts = [
      comment,
      instagram ? `Instagram/Telegram: ${instagram}` : '',
      `Як зв'язатись: ${contactLabel}`,
      `Доставка: Нова пошта (${deliveryTarget}), оплата доставки на пошті`,
      `Спосіб оплати: ${getSelectedPaymentLabel()}`,
      paymentComment,
      trackingComment,
    ].filter(Boolean);
    const warehouseName = state.selectedWarehouse.name || warehouseInput.value;

    return {
      locale: window.OKOLO_CHECKOUT_LOCALE || 'uk',
      payment_type: paymentType,
      amount: paymentType === 'full' ? subtotal : 0,
      cart_total: subtotal,
      cart_token: (state.cart && state.cart.token) || '',
      customer: {
        first_name: name.first_name,
        last_name: name.last_name,
        phone: normalizePhone(phone),
        email: normalizeText(email),
      },
      shipping_type: 'ukraine',
      shipping: {
        type: 'ukraine',
        delivery_method: getSelectedDeliveryMethod(),
        city: state.selectedCity.name || cityInput.value,
        city_ref: state.selectedCity.ref || '',
        warehouse: warehouseName,
        warehouse_ref: state.selectedWarehouse.ref || '',
        shipping_price: 0,
      },
      goods: cartGoods(),
      comment: commentParts.join('\n'),
      personal_data_consent: Boolean(document.getElementById('okolo-consent').checked),
      tracking,
      utm: tracking,
    };
  }

  async function clearCart() {
    try {
      await fetch(shopifyUrl('cart/clear.js'), {
        method: 'POST',
        headers: { Accept: 'application/json' },
        credentials: 'same-origin',
      });
    } catch (error) {
      // Order is already created, so redirect should continue even if cart cleanup fails.
    }
  }

  function thankYouUrl(data) {
    const fallback = data.paymentType === 'full' ? FULL_PAYMENT_URL : (data.redirectUrl || '/');
    try {
      const url = new URL(fallback, window.location.origin);
      if (data.shopifyOrderName) url.searchParams.set('order', data.shopifyOrderName);
      if (data.reference) url.searchParams.set('reference', data.reference);
      if (data.paymentType) url.searchParams.set('payment', data.paymentType);
      if (data.amount) url.searchParams.set('amount', data.amount);
      return url.toString();
    } catch (error) {
      return fallback;
    }
  }

  async function submitOrder(event) {
    event.preventDefault();
    if (state.isSubmitting || !validateForm()) return;

    state.isSubmitting = true;
    submitButton.disabled = true;
    setStatus('Створюємо замовлення...', '');

    try {
      const payload = buildPayload();
      const response = await fetch(`${API_BASE_URL}/api/orders/create-invoice`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          Accept: 'application/json',
        },
        body: JSON.stringify(payload),
      });
      const data = await response.json().catch(function () {
        return {};
      });
      if (!response.ok) throw new Error(data.message || data.error || 'Не вдалося оформити замовлення');

      setStatus(data.message || 'Замовлення оформлено. Переходимо далі...', 'success');
      await clearCart();
      window.location.href = thankYouUrl({
        ...data,
        paymentType: payload.payment_type || data.paymentType,
        amount: payload.amount || data.amount,
      });
    } catch (error) {
      setStatus(error.message || 'Не вдалося оформити замовлення. Спробуйте ще раз.', 'error');
      state.isSubmitting = false;
      submitButton.disabled = false;
    }
  }

  cityInput.addEventListener('input', function () {
    clearFieldError(cityInput);
    searchCities();
  });

  warehouseInput.addEventListener('input', function () {
    state.selectedWarehouse = null;
    clearFieldError(warehouseInput);
    searchWarehouses();
  });

  warehouseInput.addEventListener('focus', function () {
    if (state.selectedCity) searchWarehouses();
  });

  deliveryMethodInputs.forEach(function (input) {
    input.addEventListener('change', function () {
      updateDeliveryMethodUi();
      if (!state.selectedCity) return;
      warehouseInput.disabled = false;
      warehouseInput.focus();
      searchWarehouses();
    });
  });

  citySuggestions.addEventListener('click', function (event) {
    const button = event.target.closest('[data-city-index]');
    if (!button) return;
    const city = citySuggestions._items && citySuggestions._items[Number(button.dataset.cityIndex)];
    if (city) selectCity(city);
  });

  warehouseSuggestions.addEventListener('click', function (event) {
    const button = event.target.closest('[data-warehouse-index]');
    if (!button) return;
    const warehouse = warehouseSuggestions._items && warehouseSuggestions._items[Number(button.dataset.warehouseIndex)];
    if (warehouse) selectWarehouse(warehouse);
  });

  document.addEventListener('click', function (event) {
    if (!event.target.closest('.okolo-field')) {
      hideSuggestions(citySuggestions);
      hideSuggestions(warehouseSuggestions);
    }
  });

  promoToggle.addEventListener('click', function () {
    const isOpen = promoToggle.getAttribute('aria-expanded') === 'true';
    promoToggle.setAttribute('aria-expanded', String(!isOpen));
    promoPanel.classList.toggle('is-open', !isOpen);
  });

  promoApply.addEventListener('click', function () {
    promoNote.textContent = 'Промокод буде переданий менеджеру разом із замовленням.';
  });

  form.addEventListener('submit', submitOrder);
  updateDeliveryMethodUi({ resetWarehouse: false });
  loadCart();
})();
</script>
