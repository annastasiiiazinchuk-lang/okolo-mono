services:
  - type: web
    name: okolo-mono
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: okolo-mono-db
          property: connectionString
      - key: WEBHOOK_URL
        sync: false
      - key: REDIRECT_URL
        sync: false
      - key: SHOPIFY_STORE_DOMAIN
        sync: false
      - key: SHOPIFY_STORE_URL
        sync: false
      - key: SHOPIFY_CLIENT_ID
        sync: false
      - key: SHOPIFY_CLIENT_SECRET
        sync: false
      - key: SHOPIFY_ADMIN_ACCESS_TOKEN
        sync: false
      - key: SHOPIFY_PAYMENT_UPDATE_DELAY_SECONDS
        value: 0
      - key: NOVA_POSHTA_API_KEY
        sync: false
      - key: SITNIKS_API_BASE_URL
        value: https://crm.sitniks.com
      - key: SITNIKS_API_TOKEN
        sync: false
      - key: SITNIKS_STATUS_ID
        sync: false
      - key: SITNIKS_SALES_CHANNEL_ID
        sync: false
      - key: SITNIKS_WAREHOUSE_ID
        sync: false
      - key: SITNIKS_NOVA_POSHTA_INTEGRATION_ID
        sync: false
      - key: SITNIKS_OFFER_MAP
        sync: false
      - key: META_PIXEL_ID
        sync: false
      - key: META_ACCESS_TOKEN
        sync: false
      - key: META_GRAPH_VERSION
        value: v23.0
      - key: GA4_MEASUREMENT_ID
        sync: false
      - key: GA4_API_SECRET
        sync: false
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    plan: 0.1c-256mb

databases:
  - name: okolo-mono-db
    plan: free
